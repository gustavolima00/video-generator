language: pt-br
proxies:
  reddit_config:
    type: json
  cover_config:
    title_font_size: 150
  tiktok_publisher_config:
    # Text-only DeepSeek V4-Flash. We compensate for the lack of vision
    # by giving the agent a tighter, more directive task prompt with
    # stable CSS selectors for the upload zone, hard-coded negative
    # rules to skip the lookalike sidebar buttons, and a no-todo-list
    # directive that saves 2-3 steps per run. See _build_task in the
    # publisher proxy and assets/tiktok_seed_lessons.md for the hints.
    # GPT-5.4-mini was tried but breaks browser-use's strict JSON
    # parser by emitting <think> blocks + concatenated objects.
    agent_model: deepseek/deepseek-v4-flash
    cookies_path: .storage/tiktok_cookies.json
    headless: false
    use_vision: false
    max_steps: 60
  image_generation_config:
    type: leonardo-v2
    model: "nano-banana-2"
    prompt_enhance: "OFF"
  llm_config:
    type: prompt
    provider_config:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
  history_adaptation_llm_config:
    type: prompt
    provider_config:
      provider: openrouter
      model: moonshotai/kimi-k2.6
      # 'high' chosen by ear (2026-07-29 audio review): tighter, punchier
      # scripts. Tradeoff seen in the shootout: it condenses harder, so
      # drop to 'low' if stories start losing important details.
      # max_tokens bounds runaway runs.
      reasoning_effort: high
      max_tokens: 12000
  speech_config:
    type: edge-tts
    default_rate: 1.3
  transcription_config:
    model: base
    type: local
  # Backgrounds are downloaded once and reused: the daily run pulls from the
  # same pool of clips, so re-downloading them is both the slowest step and
  # what gets this IP throttled (HTTP 429). The whole block is optional — the
  # values below are the defaults, listed here so they are easy to override.
  # youtube_config:
  #   type: pytube
  #   cache:
  #     enabled: true                                 # false = re-download every run
  #     dir: ~/.cache/video-generator/backgrounds     # '~' expanded; created on demand
  #     max_gigabytes: 20                             # disk budget for the directory
services:
  captions_config:
    font_path: default_font.ttf
  video_config:
    call_to_action_path: assets/call_to_action.png
    # How long the cover card stays on screen. It overlays the opening of the
    # story — narration and captions run from the first frame — so this is a
    # display duration, not a lead-in: raising it does not lengthen the video.
    cover_duration: 3
    youtube_channel_url: https://www.youtube.com/@FoodieBoyKR
    youtube_channel_urls:
      - https://www.youtube.com/@FoodieBoyKR
      - https://www.youtube.com/@cookming
      - https://www.youtube.com/@menwiththepot
    youtube_surface: shorts
    youtube_channel_strategy: all
    youtube_pool_size: 100
    # Explicit so the output no longer inherits whatever frame rate the
    # YouTube background happens to have. 60 keeps what prod produced
    # before; 30 halves render time if that ever matters.
    fps: 60
    ffmpeg_params: ["-crf", "23", "-preset", "medium"]
    anti_fingerprint:
      enabled: true
      mirror: true
      zoom: 1.04
      brightness_delta: 0.02
      contrast_delta: 0
      hue_shift_degrees: 0
      speed_delta: 0.02
bots:
  image_story_bot:
    allowed_user_ids: [627370641]
    low_quality: false
  satisfying_bot:
    allowed_user_ids: [627370641]
    low_quality: false
    daily_hour_utc: 9
    daily_minute_utc: 30
    daily_auto_publish_count: 3
    publish_slots_local:
      - "12:00"
      - "18:00"
      - "20:00"
    publish_min_lead_minutes: 30
    publish_hashtags: []
evaluation:
  subreddits:
    - pettyrevenge
    - AmItheAsshole
    - RelationshipAdvice
    - TrueOffMyChest
    - AskReddit
    - ExplainLikeImFive
    - MaliciousCompliance
    - Antiwork
    - EuSouOBabaca
    - RelatosDoReddit
    - relacionamentos
  min_chars: 500
  max_chars: 15000
